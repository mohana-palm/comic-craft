<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Comic Preview</title>

    <style>

        body {
            margin: 0;
            padding: 30px;
            font-family: Arial, sans-serif;
            background: #f2f2f2;
        }

        h1 {
            text-align: center;
        }

        .panel {
            max-width: 800px;
            margin: 0 auto 30px;
            background: white;
            padding: 25px;
            border-radius: 15px;
        }

        .panel img {
            width: 100%;
            max-height: 600px;
            object-fit: contain;
            border-radius: 10px;
        }

        .scene {
            font-style: italic;
            color: #555;
        }

        .dialogue {
            background: #eeeeee;
            padding: 12px;
            border-radius: 8px;
        }

        .download {
            display: block;
            width: 300px;
            margin: 20px auto;
            padding: 14px;
            text-align: center;
            background: #667eea;
            color: white;
            text-decoration: none;
            border-radius: 8px;
        }

    </style>

</head>

<body>

<h1>📖 Your Comic</h1>


{% for panel in layout %}

<div class="panel">

    <h2>
        Panel {{ panel.panel_number }}:
        {{ panel.title }}
    </h2>


    <img
        src="{{ panel.image }}"
        alt="Comic Panel"
    >


    <p class="scene">
        {{ panel.scene_description }}
    </p>


    <p>
        <strong>Caption:</strong>
        {{ panel.caption }}
    </p>


    <p>
        <strong>Narration:</strong>
        {{ panel.narration }}
    </p>


    <div class="dialogue">

        <strong>Dialogue:</strong>

        {{ panel.dialogue }}

    </div>

</div>

{% endfor %}


<a
    class="download"
    href="{{ pdf_path }}"
    target="_blank"
>
    📥 Download Comic PDF
</a>


<a
    class="download"
    href="/"
>
    ✨ Create Another Comic
</a>


</body>

</html>
